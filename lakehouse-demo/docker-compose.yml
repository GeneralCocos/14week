version: '3.9'

services:
  # Postgres: источник данных
  postgres:
    image: postgres:15
    container_name: pg_source
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lake-net

  # mariadb для Hive Metastore
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    networks:
      - lake-net

  # Hive Metastore (пример из cold-storage-demo, но без Trино)
  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"   # thrift
    environment:
      METASTORE_DB_HOSTNAME: mariadb
    volumes:
      - ./hive/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
      - ./hadoop/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    depends_on:
      - mariadb
    networks:
      - lake-net

  # MinIO как S3
  minio:
    image: minio/minio:RELEASE.2023-04-28T18-11-17Z
    container_name: minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_VOLUMES: /mnt/data
    command: server /mnt/data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lake-net

  # Инициализация бакета warehouse в MinIO (аналог minio-setup из cold-storage-demo)
  minio-setup:
    image: minio/mc:RELEASE.2023-04-12T02-21-51Z
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 minio minio123) do
        echo '...waiting for minio...' && sleep 1;
      done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc policy set public minio/warehouse;
      exit 0;
      "
    networks:
      - lake-net

  # Spark master
  spark-master:
    build:
      context: ./spark
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark/apps:/opt/bitnami/spark/apps
      - ./data:/data
    networks:
      - lake-net
    depends_on:
      - hive-metastore
      - minio
      - postgres

  # Spark worker
  spark-worker:
    build:
      context: ./spark
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    networks:
      - lake-net
    depends_on:
      - spark-master

  # Jupyter Notebook с PySpark
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: demo
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
    networks:
      - lake-net
    depends_on:
      - spark-master

networks:
  lake-net:
    driver: bridge
